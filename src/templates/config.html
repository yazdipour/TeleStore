<main class="app-shell">
  <header class="app-header">
    <div class="brand">
      <svg class="brand-plane" viewBox="0 0 56 56" aria-hidden="true">
        <circle cx="28" cy="28" r="28" fill="#2AABEE"/>
        <path d="M12.5 27.3l29.5-11.4c1.4-.5 2.6.3 2.2 2.4l-5 23.7c-.4 1.7-1.4 2.1-2.9 1.3l-7.7-5.7-3.7 3.6c-.4.4-.8.8-1.5.8l.5-7.8 14.2-12.8c.6-.6-.1-.9-1-.3l-17.5 11-7.5-2.4c-1.6-.5-1.7-1.6.4-2.4z" fill="#fff"/>
      </svg>
      <div>
        <p class="eyebrow">TeleStore</p>
        <h1>Channels</h1>
      </div>
    </div>
    <!--AUTH-->
  </header>
  <!--STATUS-->
  <section class="dashboard-grid">
    <section class="panel">
      <form class="add-channel-form" method="post" action="/config/channels">
        <input name="channel" placeholder="@channel or https://t.me/channel" aria-label="Telegram channel name or URL" required>
        <button type="submit">Add channel</button>
      </form>
    </section>
    <section class="panel channels-panel">
      <div class="panel-head"><h2>Sources</h2><span class="count"><!--COUNT--></span></div>
      <!--CHANNEL_LIST-->
    </section>
  </section>
</main>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TeleStore</title>
  <link rel="icon" href="/icon.png">
  <style>
    :root {
      --sky: #0E1621;
      --panel: #17212B;
      --panel-raised: #1E2C3A;
      --line: #243141;
      --ink: #F5FAFF;
      --muted: #708499;
      --accent: #2AABEE;
      --accent-deep: #1E96D1;
      --danger: #E5534B;
      --radius: 12px;
      --font-display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 0 16px;
      color: var(--ink);
      background: var(--sky);
      font-family: var(--font-body);
      line-height: 1.5;
    }

    a { color: var(--accent); text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    a:hover { text-decoration-color: var(--accent); }

    h1, h2 {
      font-family: var(--font-display);
      letter-spacing: -0.01em;
      line-height: 1.2;
      margin: 0;
    }
    h1 { font-size: 1.7rem; font-weight: 700; }
    h2 { font-size: 1.05rem; font-weight: 600; }

    button, input { font: inherit; }
    button {
      border: 1px solid transparent;
      background: var(--accent);
      color: #FFFFFF;
      border-radius: 10px;
      cursor: pointer;
      min-height: 42px;
      padding: 0 16px;
      font-weight: 600;
      transition: background-color 120ms ease;
    }
    button:hover { background: var(--accent-deep); }
    input {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--ink);
      padding: 10px 14px;
    }
    input::placeholder { color: var(--muted); }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    code {
      display: inline-block;
      max-width: 100%;
      font-family: var(--font-mono);
      font-size: 0.85em;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--sky);
      color: var(--accent);
      overflow-wrap: anywhere;
    }
    form, ul { margin: 0; }
    ul { padding-left: 0; list-style: none; }

    /* Narrow pages: login flow and status notes */
    body > h1, body > p, body > form, body > ul {
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }
    body > h1 {
      margin-top: 64px;
      padding-top: 68px;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="%232AABEE"/><path d="M12.5 27.3l29.5-11.4c1.4-.5 2.6.3 2.2 2.4l-5 23.7c-.4 1.7-1.4 2.1-2.9 1.3l-7.7-5.7-3.7 3.6c-.4.4-.8.8-1.5.8l.5-7.8 14.2-12.8c.6-.6-.1-.9-1-.3l-17.5 11-7.5-2.4c-1.6-.5-1.7-1.6.4-2.4z" fill="white"/></svg>') no-repeat top left / 52px 52px;
    }
    body > p { color: var(--muted); }
    body > form {
      display: grid;
      gap: 14px;
      margin-top: 20px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }
    body > ul { margin-top: 20px; display: grid; gap: 10px; }
    label { display: grid; gap: 6px; color: var(--muted); font-weight: 500; font-size: 0.9rem; }
    .error { color: var(--danger); font-weight: 600; }

    /* Dashboard */
    .app-shell {
      max-width: 720px;
      margin: 40px auto 64px;
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      margin-bottom: 20px;
      /* dotted flight path under the header, trailing off to the right */
      background:
        repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 14px)
        left bottom / 100% 1px no-repeat;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-plane { width: 44px; height: 44px; flex: none; }
    .brand .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .status {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
    }
    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status.ready::before { background: #4FBF67; }
    .status.pending { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
    .status.pending::before { background: var(--danger); }

    .notice {
      margin: 0 0 16px;
      border-radius: 10px;
      padding: 12px 16px;
      font-weight: 500;
    }
    .notice.error {
      border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      color: var(--ink);
    }

    .dashboard-grid { display: grid; gap: 16px; }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      padding: 18px;
    }
    .add-channel-form { display: flex; gap: 10px; }
    .add-channel-form input { flex: 1; background: var(--sky); }
    .panel-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .count {
      display: inline-grid;
      place-items: center;
      min-width: 26px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: var(--accent);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.78rem;
    }

    /* Channel rows, in the manner of a Telegram chat list */
    .source-list { display: grid; gap: 4px; }
    .source-card {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border-radius: 10px;
      transition: background-color 120ms ease;
    }
    .source-card:hover { background: var(--panel-raised); }
    .source-icon {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--panel-raised);
      border: 2px solid var(--source-tint, var(--accent));
    }
    .source-name { font-family: var(--font-display); font-weight: 600; font-size: 1rem; }
    .source-meta { color: var(--muted); font-size: 0.88rem; }
    .source-url { display: block; margin-top: 6px; text-decoration: none; }
    .source-url code { border-color: transparent; padding-left: 0; background: transparent; }
    .source-url:hover code { color: var(--ink); }
    .source-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: end; }
    .source-actions form { display: inline; }
    .source-actions button {
      min-height: 36px;
      padding: 0 12px;
      font-size: 0.88rem;
      background: var(--panel-raised);
      color: var(--accent);
      border-color: var(--line);
    }
    .source-actions button:hover { background: var(--line); }
    .remove-button, .source-actions .remove-button {
      color: var(--danger);
      background: transparent;
    }
    .empty {
      border: 1px dashed var(--line);
      border-radius: 10px;
      padding: 28px 20px;
      color: var(--muted);
      text-align: center;
    }
    .panel-copy { margin: 0; color: var(--muted); }
    .text-link { display: inline-block; margin-top: 12px; font-weight: 600; }

    @media (max-width: 560px) {
      .app-shell { margin: 24px auto 48px; }
      .app-header { flex-direction: column; align-items: start; }
      .source-card { grid-template-columns: 46px minmax(0, 1fr); }
      .source-icon { width: 46px; height: 46px; }
      .source-actions { grid-column: 1 / -1; justify-content: start; }
      .add-channel-form { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
  <script>
    async function copySourceUrl(button, url) {
      try {
        await navigator.clipboard.writeText(url);
        button.textContent = "Copied";
      } catch (error) {
        const input = document.createElement("input");
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
        button.textContent = "Copied";
      }
      setTimeout(() => button.textContent = "Copy", 1400);
    }
  </script>
</head>
<body><!--BODY--></body>
</html>
